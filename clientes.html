<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Alas de Sanación</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>
  <div class="admin-layout">
    <header class="admin-header">
      <div class="admin-brand">
        <img src="assets/logo.png" alt="Alas de Sanación" class="admin-logo">
        <h1>ALAS DE SANACIÓN</h1>
      </div>
      <nav class="admin-nav">
        <a href="dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="clientes.html" data-page="clientes">Clientes</a>
        <a href="#" id="logout-btn">Salir</a>
      </nav>
    </header>

    <main class="admin-main">
      <div class="page-header">
        <h2>Clientes</h2>
        <div class="page-header-actions">
          <button id="export-all-zip-btn" class="btn btn-outline">Descargar todas (ZIP por paciente)</button>
          <button id="add-client-btn" class="btn btn-gold">+ Agregar Cliente</button>
        </div>
      </div>

      <div class="search-bar">
        <div class="form-group">
          <label for="filter-type">Filtrar por</label>
          <select id="filter-type">
            <option value="nombre">Nombre</option>
            <option value="celular">Teléfono</option>
            <option value="fecha_nacimiento">Fecha de cumpleaños</option>
            <option value="correo">Correo</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filter-value">Valor</label>
          <input type="text" id="filter-value" placeholder="Buscar...">
        </div>
        <button id="search-btn" class="btn btn-gold">Buscar</button>
        <button id="clear-search-btn" class="btn btn-outline">Limpiar</button>
      </div>

      <div class="clients-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Nacimiento</th>
              <th>Celular</th>
              <th>Correo</th>
              <th>Consultas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="clients-tbody">
            <tr><td colspan="6" class="loading">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal: Cliente -->
  <div class="modal-overlay" id="client-modal">
    <div class="modal">
      <div class="modal-logo-wrap">
        <img src="assets/logo.png" alt="Alas de Sanación" class="modal-logo">
      </div>
      <div class="modal-header">
        <h3 id="client-modal-title">Agregar Cliente</h3>
        <button class="modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <form id="client-form">
        <div class="form-group">
          <label for="client-nombre">Nombre *</label>
          <input type="text" id="client-nombre" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="client-fecha">Fecha de nacimiento *</label>
            <input type="date" id="client-fecha" required>
          </div>
          <div class="form-group">
            <label for="client-celular">Celular *</label>
            <input type="tel" id="client-celular" required placeholder="3201234567">
          </div>
        </div>
        <div class="form-group">
          <label for="client-correo">Correo</label>
          <input type="email" id="client-correo" placeholder="correo@ejemplo.com">
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Guardar</button>
      </form>
    </div>
  </div>

  <!-- Modal: Consultas -->
  <div class="modal-overlay" id="consultas-modal">
    <div class="modal modal-lg">
      <div class="modal-logo-wrap">
        <img src="assets/logo.png" alt="Alas de Sanación" class="modal-logo">
      </div>
      <div class="modal-header">
        <h3 id="consultas-modal-title">Consultas</h3>
        <button class="modal-close" aria-label="Cerrar">&times;</button>
      </div>

      <h4 class="modal-section-title">Nueva Consulta</h4>
      <form id="consulta-form">
        <div class="form-group">
          <label for="consulta-titulo">Título</label>
          <input type="text" id="consulta-titulo" placeholder="Ej: Sesión de sanación emocional">
        </div>
        <div class="form-group">
          <label for="consulta-contenido">Historia clínica / Notas *</label>
          <textarea id="consulta-contenido" required placeholder="Registra aquí los detalles de la consulta..."></textarea>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Agregar Consulta</button>
      </form>

      <hr class="modal-divider">

      <h4 class="modal-section-title">Consultas registradas</h4>

      <div class="consultas-toolbar">
        <label class="select-all-label">
          <input type="checkbox" id="select-all-consultas">
          Seleccionar todas
        </label>
        <span id="selected-count" class="selected-count">0 seleccionadas</span>
      </div>

      <div class="export-actions">
        <button id="export-txt-btn" class="btn btn-sm btn-outline">Descargar seleccionadas (.TXT)</button>
        <button id="export-word-btn" class="btn btn-sm btn-gold">Descargar seleccionadas (Word)</button>
      </div>

      <div class="consultas-list" id="consultas-list"></div>
    </div>
  </div>

  <!-- Modal: Ver consulta completa -->
  <div class="modal-overlay" id="consulta-view-modal">
    <div class="modal modal-lg">
      <div class="modal-logo-wrap">
        <img src="assets/logo.png" alt="Alas de Sanación" class="modal-logo">
      </div>
      <div class="modal-header">
        <h3 id="view-consulta-titulo">Consulta</h3>
        <button class="modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <p id="view-consulta-fecha" class="consulta-view-fecha"></p>
      <div id="view-consulta-contenido" class="consulta-view-body"></div>
      <div class="consulta-view-actions">
        <button type="button" id="edit-from-view-btn" class="btn btn-gold">Editar consulta</button>
        <button type="button" class="btn btn-outline modal-close">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Editar consulta -->
  <div class="modal-overlay" id="consulta-edit-modal">
    <div class="modal modal-lg">
      <div class="modal-logo-wrap">
        <img src="assets/logo.png" alt="Alas de Sanación" class="modal-logo">
      </div>
      <div class="modal-header">
        <h3>Editar Consulta</h3>
        <button class="modal-close" aria-label="Cerrar">&times;</button>
      </div>
      <form id="consulta-edit-form">
        <div class="form-group">
          <label for="edit-consulta-titulo">Título</label>
          <input type="text" id="edit-consulta-titulo">
        </div>
        <div class="form-group">
          <label for="edit-consulta-contenido">Historia clínica / Notas *</label>
          <textarea id="edit-consulta-contenido" required></textarea>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Guardar cambios</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { requireAuth, initAdminNav } from './js/auth.js';
    import { initClientesPage } from './js/clientes-page.js';

    await requireAuth();
    initAdminNav('clientes');
    initClientesPage();
  </script>
</body>
</html>

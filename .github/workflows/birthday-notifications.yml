name: Notificaciones cumpleaños automáticas

on:
  schedule:
    # Intentos 7-11 UTC (2-6 AM Colombia). Envía a las 2-3 AM para que
    # CallMeBot entregue cerca de las 6:00 AM (suele tardar varias horas).
    - cron: '0 7-11 * * *'
  workflow_dispatch:

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar WhatsApp de cumpleaños al teléfono registrado
        run: |
          HORA_CO=$(TZ=America/Bogota date +%H)
          echo "Hora actual en Colombia: ${HORA_CO}:00"

          if [ "$HORA_CO" != "02" ] && [ "$HORA_CO" != "03" ]; then
            echo "Fuera de ventana de envío (2-3 AM Colombia). Esperando horario para entrega ~6 AM."
            exit 0
          fi

          echo "Disparando notificación (entrega estimada ~6:00 AM Colombia)..."
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://dfgfjiasjyvfdrneqydu.supabase.co/functions/v1/smooth-responder" \
            -H "Authorization: Bearer sb_publishable_dVaokbKpER5OTVt3ipw_AA_H4psKv2z" \
            -H "apikey: sb_publishable_dVaokbKpER5OTVt3ipw_AA_H4psKv2z" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::La función smooth-responder no está desplegada en Supabase."
            exit 1
          fi

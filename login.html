<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Alas de Sanación</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img src="assets/logo.png" alt="Logo" class="logo-small">
      <h2>Panel Admin</h2>
      <p class="subtitle">Ingresa tus credenciales para continuar</p>

      <div class="form-error" id="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Ej: Ana">
        </div>
        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;margin-top:0.5rem;">Ingresar</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;">
        <a href="index.html" style="font-size:0.85rem;color:var(--text-muted);">← Volver al inicio</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { signIn, getSupabase } from './js/auth.js';

    const { data: { session } } = await getSupabase().auth.getSession();
    if (session) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signIn(email, password, username);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      }
    });
  </script>
</body>
</html>
